<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0d1117; --panel: #161b22; --panel2: #21262d; --input: #0d1117;
  --text: #e6edf3; --muted: #8b949e; --border: #30363d; --border2: #3d444d;
}
:root.light {
  color-scheme: light;
  --bg: #f6f8fa; --panel: #ffffff; --panel2: #eaeef2; --input: #ffffff;
  --text: #1f2328; --muted: #57606a; --border: #d0d7de; --border2: #d0d7de;
}
body { font-family: system-ui, Segoe UI, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
header { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; }
#status { font-size: 13px; color: var(--muted); }
#status b.ok { color: #7ee787; } #status b.bad { color: #ff7b72; }
main { display: grid; grid-template-columns: 400px 1fr; gap: 16px; padding: 16px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { flex: 1; min-width: 70px; padding: 8px 4px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border2); background: var(--panel2); color: var(--text); cursor: pointer; }
.tabs button.active { background: #2f81f7; border-color: #2f81f7; }
label { display: block; font-size: 13px; margin: 10px 0 4px; color: var(--muted); }
input[type=text], input[type=number], textarea, select { width: 100%; box-sizing: border-box; background: var(--input); color: var(--text); border: 1px solid var(--border2); border-radius: 6px; padding: 8px; }
select option { background: var(--panel); color: var(--text); }
textarea { min-height: 70px; resize: vertical; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; } .row > div { flex: 1; min-width: 120px; }
.modelrow { display: flex; gap: 8px; align-items: center; }
.modelrow select { flex: 1; min-width: 0; }
button.dl { padding: 8px 10px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border2); background: #1f6feb; color: #fff; cursor: pointer; white-space: nowrap; }
button.dl:disabled { opacity: .55; cursor: wait; }
.hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
button.go { width: 100%; margin-top: 12px; padding: 10px; font-size: 15px; border: 0; border-radius: 6px; background: #238636; color: #fff; cursor: pointer; }
button.go:disabled { opacity: .5; cursor: wait; }
#warn { background: #5a2d0c; border: 1px solid #a35c00; border-radius: 6px; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; display: none; }
#gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
figure { margin: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
figure img { width: 100%; display: block; }
figcaption { font-size: 12px; padding: 8px 10px; color: var(--muted); word-break: break-word; }
figcaption a { color: #2f81f7; }
#log { font-size: 12px; white-space: pre-wrap; background: var(--input); border: 1px solid var(--border); border-radius: 6px; padding: 8px; min-height: 60px; max-height: 220px; overflow-y: auto; user-select: text; margin-top: 6px; }
img.preview { max-width: 100%; border-radius: 6px; border: 1px solid var(--border2); margin-top: 6px; }
canvas#maskpad { width: 100%; border-radius: 6px; border: 1px solid var(--border2); cursor: crosshair; touch-action: none; }
#txtout { font-size: 14px; background: var(--input); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-top: 10px; white-space: pre-wrap; min-height: 40px; }

@media (max-width: 520px) {
  .tabs button { font-size: 10px; min-width: 56px; padding: 7px 2px; }
  main { padding: 10px; }
  .panel { padding: 10px; }
}
</style>
</head>
<body>
<header>
<h1>Prism</h1>
<span id="status">connecting…</span>
<button onclick="refresh()" style="margin-left:auto;padding:6px 12px;border-radius:6px;border:1px solid var(--border2);background:var(--panel2);color:#fff;cursor:pointer">Refresh</button>
<button id="themeBtn" onclick="toggleTheme()" style="margin-left:auto;padding:6px 12px;border-radius:6px;border:1px solid var(--border2);background:var(--panel2);color:var(--text);cursor:pointer">Light</button>
</header>
<main>
<div class="panel">
<div id="warn"></div>
<div class="tabs">
<button id="tabTxt" class="active" onclick="showTab('txt')">Generate</button>
<button id="tabTr" onclick="showTab('tr')">Transcribe</button>
<button id="tabUp" onclick="showTab('up')">Upscale</button>
<button id="tabCap" onclick="showTab('cap')">Caption</button>
<button id="tabPaint" onclick="showTab('paint')">Inpaint</button>
<button id="tabImg" onclick="showTab('img')">Edit</button>
<button id="tabTools" onclick="showTab('tools')">Tools</button>
<button id="tabModels" onclick="showTab('models')">Models</button>
<button id="tabSettings" onclick="showTab('settings')">Settings</button>
</div>
<div id="imagemodelwrap">
<label>Image model</label>
<div class="modelrow">
<select id="model" onchange="try{localStorage.setItem('u_model',this.value)}catch(e){}; syncDownloads()"><option value="">(loading…)</option></select>
<button class="dl" id="dlImage" onclick="downloadSelected('image')" style="display:none">Download</button>
</div>
<div class="hint" id="dlImageHint"></div>
</div>

<div id="formTxt">
<label>Prompt</label>
<textarea id="prompt" placeholder="a cozy mountain cabin at sunset, pine forest, detailed"></textarea>
<label>Negative prompt</label>
<textarea id="negprompt" placeholder="blurry, low quality, distorted, watermark"></textarea>
<div class="row">
<div><label>Resolution</label><select id="size" onchange="toggleCustom('size','sizecustom')">
<option>256x256</option><option selected>512x512</option><option>768x768</option><option>1024x1024</option><option value="custom">custom…</option></select>
<input id="sizecustom" type="text" placeholder="WxH (e.g. 640x384)" style="display:none"></div>
<div><label>Quality</label><select id="quality"><option value="low">low (fast)</option><option value="medium" selected>medium</option><option value="high">high (slow)</option></select></div>
</div>
<label>Guidance (1.0 = LCM; &gt;1 uses the negative prompt, slower)</label>
<input type="number" id="guidance" value="1.0" min="1" max="3" step="0.1" style="width:100%">
<button class="go" id="btnTxt" onclick="generateTxt()">Generate</button>
</div>

<div id="formImg" style="display:none">
<label>Reference image</label>
<input type="file" id="refimg" accept="image/*" onchange="previewRef(this,'refprev')">
<img id="refprev" class="preview" style="display:none">
<label>Prompt (what to change / style)</label>
<textarea id="prompt2" placeholder="same cabin in winter, snow, night lights"></textarea>
<label>Negative prompt</label>
<textarea id="negprompt2" placeholder="blurry, low quality, distorted"></textarea>
<div class="row">
<div><label>Resolution</label><select id="size2" onchange="toggleCustom('size2','sizecustom2')">
<option>256x256</option><option selected>512x512</option><option>768x768</option><option>1024x1024</option><option value="custom">custom…</option></select>
<input id="sizecustom2" type="text" placeholder="WxH" style="display:none"></div>
<div><label>Quality</label><select id="quality2"><option value="low">low</option><option value="medium" selected>medium</option><option value="high">high</option></select></div>
</div>
<label>Guidance</label>
<input type="number" id="guidance2" value="1.0" min="1" max="3" step="0.1" style="width:100%">
<label>Change strength: <span id="strval">0.75</span></label>
<input type="range" id="strength" min="0.1" max="1" step="0.05" value="0.75" style="width:100%" oninput="document.getElementById('strval').textContent=this.value">
<button class="go" id="btnImg" onclick="generateImg()">Generate from reference</button>
</div>

<div id="formPaint" style="display:none">
<label>Image to fix (e.g. remove people in background)</label>
<input type="file" id="paintimg" accept="image/*" onchange="loadPaint(this)">
<label>Paint over the area to replace (white = repaint)</label>
<canvas id="maskpad" width="384" height="384"></canvas>
<div class="row">
<div><label>Brush</label><input type="range" id="brush" min="4" max="60" value="24" style="width:100%"></div>
<div><label>&nbsp;</label><button onclick="clearMask()" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border2);background:var(--panel2);color:#fff;cursor:pointer">Clear mask</button></div>
</div>
<div class="row">
<div><label>Mode</label><select id="paintmode" onchange="togglePaintColor()">
<option value="add">Add / replace (prompt)</option>
<option value="remove">Remove (prompt: empty background)</option>
<option value="color">Change color (no AI)</option>
<option value="outpaint">Expand canvas (outpaint)</option>
</select></div>
<div id="paintcolorwrap" style="display:none"><label>Target color</label><input type="color" id="paintcolor" value="#0066ff" style="width:100%;height:38px"></div>
<div id="paintmarginwrap" style="display:none"><label>Expand each side by (%)</label><input type="number" id="paintmargin" value="25" min="5" max="100" step="5" style="width:100%"></div>
</div>
<label>Prompt (what should be there instead)</label>
<textarea id="prompt3" placeholder="empty street, no people, clean background"></textarea>
<label>Negative prompt</label>
<textarea id="negprompt3" placeholder="blurry, low quality, distorted"></textarea>
<div class="row">
<div><label>Resolution</label><select id="size3" onchange="toggleCustom('size3','sizecustom3')">
<option>256x256</option><option>512x512</option><option selected>512x512</option><option>768x768</option><option value="custom">custom…</option></select>
<input id="sizecustom3" type="text" placeholder="WxH" style="display:none"></div>
<div><label>Guidance</label><input type="number" id="guidance3" value="1.0" min="1" max="3" step="0.1" style="width:100%"></div>
</div>
<label>Inpaint strength: <span id="strval3">0.85</span></label>
<input type="range" id="strength3" min="0.1" max="1" step="0.05" value="0.85" style="width:100%" oninput="document.getElementById('strval3').textContent=this.value">
<button class="go" id="btnPaint" onclick="generatePaint()">Inpaint masked area</button>
</div>

<div id="formUp" style="display:none">
<label>Image to upscale (Real-ESRGAN-x4v3, photos; Waifu2x-class for anime via scale 2)</label>
<input type="file" id="upimg" accept="image/*" onchange="previewRef(this,'upprev')">
<img id="upprev" class="preview" style="display:none">
<div class="row">
<div><label>Scale</label><select id="upscale"><option value="2" selected>2x</option><option value="3">3x</option><option value="4">4x</option></select></div>
<div><label>Model</label><div class="modelrow"><select id="upmodel" onchange="try{localStorage.setItem('u_upmodel',this.value)}catch(e){}; syncDownloads()"><option value="RealESRGAN_x4v3">RealESRGAN x4</option></select><button class="dl" id="dlUpscale" onclick="downloadSelected('upscale')" style="display:none">Download</button></div><div class="hint" id="dlUpscaleHint"></div></div>
</div>
<button class="go" id="btnUp" onclick="generateUp()">Upscale</button>
</div>

<div id="formTr" style="display:none">
<label>Audio or video file (mp3/wav/m4a/webm/mp4, max 500 MB)</label>
<input type="file" id="trfile" accept="audio/*,video/*">
<div class="row">
<div><label>Whisper model</label><div class="modelrow"><select id="trmodel" onchange="try{localStorage.setItem('u_trmodel',this.value)}catch(e){}; syncDownloads()"><option value="small">small</option></select><button class="dl" id="dlAudio" onclick="downloadSelected('audio')" style="display:none">Download</button></div><div class="hint" id="dlAudioHint"></div></div>
<div><label>Language (empty = auto)</label><select id="trlang"><option value="">auto</option><option value="sk">sk</option><option value="cs">cs</option><option value="en">en</option></select></div>
</div>
<div class="row">
<div><label><input type="checkbox" id="trsplit"> Split into 30s chunks (remote WhisperApi only)</label></div>
</div>
<button class="go" id="btnTr" onclick="generateTr()">Transcribe</button>
<div id="txtout">transcript appears here…</div>
<a href="#" id="trsave" style="display:none;color:#58a6ff;font-size:12px" onclick="saveTranscript();return false">Save transcript</a>
</div>

<div id="formCap" style="display:none">
<label>Image to describe (SmolVLM-500M, PC engine)</label>
<input type="file" id="capimg" accept="image/*" onchange="previewRef(this,'capprev')">
<img id="capprev" class="preview" style="display:none">
<label>Prompt</label>
<textarea id="prompt4" placeholder="Describe the image in detail."></textarea>
<button class="go" id="btnCap" onclick="generateCap()">Caption</button>
<div id="capout">caption appears here…</div>
</div>

<div id="formTools" style="display:none">
<label>FFmpeg Tools — convert, compress, extract, trim</label>
<div class="row">
<div><label>Input file</label><input type="file" id="toolfile" accept="*/*"></div>
<div><label>Operation</label><select id="toolop" onchange="refreshToolPresets()">
<option value="convert-video">Convert Video</option>
<option value="convert-audio">Convert Audio</option>
<option value="convert-image">Convert Image</option>
<option value="extract-audio">Extract Audio</option>
<option value="trim">Trim</option>
<option value="compress">Compress</option>
<option value="info">Media Info</option>
</select></div>
</div>
<div id="toolPresetWrap" class="row" style="margin-top:8px"><div><label>Preset</label><select id="toolpreset"></select></div></div>
<div id="toolOpts"></div>
<button class="go" id="btnTool" onclick="runTool()">Run</button>
<div id="toolout">result appears here…</div>
</div>

<div id="formModels" style="display:none">
<label>Installed / available models</label>
<div class="row" style="margin-bottom:8px">
<div><button class="go" style="margin-top:0" onclick="loadCatalog()">Refresh catalog</button></div>
<div><button class="go" style="margin-top:0;background:#1f6feb" onclick="installMissing()">Download all missing</button></div>
</div>
<div id="modelList"></div>

<label style="margin-top:14px">Find models on HuggingFace</label>
<div class="row">
<div><input type="text" id="modelQuery" placeholder="e.g. dreamshaper, sdxl, realesrgan, whisper"></div>
<div style="max-width:110px"><button class="go" style="margin-top:0" onclick="findModels()">Search</button></div>
</div>
<div id="findResults"></div>

<label style="margin-top:14px">Custom models (outside catalog)</label>
<div id="customList"></div>
</div>

<div id="formSettings" style="display:none">
<label>Server</label>
<div id="settingsBox" style="font-size:12px;background:var(--input);border:1px solid var(--border);border-radius:6px;padding:10px;white-space:pre-wrap">loading…</div>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
<span style="font-size:11px;color:#7d8590;font-weight:bold">CONSOLE</span>
<span>
<a href="#" onclick="copyLog();return false" style="color:#58a6ff;font-size:11px;margin-right:12px">copy</a>
<a href="#" onclick="clearLog();return false" style="color:#58a6ff;font-size:11px">clear</a>
</span>
</div>
<div id="log"></div>
</div>
<div>
<div id="gallery"></div>
</div>
</main>
<script>
let MODELS = [];
function toggleTheme(){
  const light = document.documentElement.classList.toggle('light');
  try { localStorage.setItem('prism-theme', light ? 'light' : 'dark'); } catch(e){}
  const b = document.getElementById('themeBtn');
  if (b) b.textContent = light ? 'Dark' : 'Light';
}
(function(){
  try {
    if (localStorage.getItem('prism-theme') === 'light') {
      document.documentElement.classList.add('light');
      const b = document.getElementById('themeBtn');
      if (b) b.textContent = 'Dark';
    }
  } catch(e){}
})();
function log(m){ const el=document.getElementById('log'); el.textContent = new Date().toLocaleTimeString()+' '+m+'\n'+el.textContent; }
function copyLog(){ const t=document.getElementById('log').textContent||''; navigator.clipboard.writeText(t); }
function clearLog(){ document.getElementById('log').textContent=''; }
async function cancelModel(id){ try { await fetch('/v1/models/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); log('stop requested: '+id); setTimeout(loadCatalog, 800); } catch(e){ log('cancel error: '+e); } }
function saveTranscript(){ const t=document.getElementById('txtout').textContent||''; const blob=new Blob([t],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='transcript_'+Date.now()+'.txt'; a.click(); }
const TABS = ['txt','img','paint','up','tr','cap','tools','models','settings'];
function showTab(t){ if(t==='models'){ loadCatalog(); loadCustom(); } if(t==='settings') loadSettings(); if(t==='tools') refreshToolPresets();
  // The image model selector only applies to the image tabs; showing it on
  // Transcribe/Upscale/Caption made those tabs look like they used image models.
  const imw = document.getElementById('imagemodelwrap');
  if (imw) imw.style.display = (t==='txt'||t==='img'||t==='paint') ? 'block' : 'none';
  for (const x of TABS) {
    document.getElementById('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active', x===t);
    document.getElementById('form'+x[0].toUpperCase()+x.slice(1)).style.display = x===t?'block':'none';
  }
}
function previewRef(inp, id){
  const f = inp.files[0]; if(!f) return;
  const img = document.getElementById(id);
  img.src = URL.createObjectURL(f); img.style.display='block';
}
function sizeLabel(x){
  const mb = x && x.size_mb;
  if (!mb) return '';
  return mb >= 1024 ? (mb/1024).toFixed(1)+' GB' : mb+' MB';
}
function modelById(id){ return MODELS.find(x => x.id === id); }
function fillSelect(sel, items, kind){
  if (!sel) return;
  const prev = sel.value;
  sel.innerHTML = '';
  for (const x of items) {
    const o = document.createElement('option');
    o.value = x.id;
    const size = sizeLabel(x);
    let suffix;
    if (x.install_state === 'downloading') suffix = ' — downloading '+(x.install_progress||0)+'%';
    else if (x.installed) suffix = ' (local)';
    else suffix = size ? ' — '+size+', not installed' : ' (not installed)';
    o.textContent = x.id + suffix;
    sel.appendChild(o);
  }
  if (prev && items.some(x => x.id === prev)) sel.value = prev;
  else if (items.length) sel.value = items[0].id;
  return sel.value;
}
function syncDownloads(){
  const map = [['image','model','dlImage','dlImageHint'],
               ['audio','trmodel','dlAudio','dlAudioHint'],
               ['upscale','upmodel','dlUpscale','dlUpscaleHint']];
  for (const spec of map) {
    const sel = document.getElementById(spec[1]);
    const btn = document.getElementById(spec[2]);
    const hint = document.getElementById(spec[3]);
    if (!sel || !btn || !hint) continue;
    const m = modelById(sel.value);
    if (!m) { btn.style.display='none'; hint.textContent=''; continue; }
    const size = sizeLabel(m);
    if (m.install_state === 'downloading') {
      btn.style.display='inline-block'; btn.disabled = true;
      btn.textContent = (m.install_progress||0)+'%';
      hint.textContent = 'Downloading '+m.id+'… '+(m.install_progress||0)+'%'+(size?' of '+size:'');
    } else if (m.installed) {
      btn.style.display='none'; btn.disabled = false; btn.textContent='Download';
      hint.textContent = '';
    } else {
      btn.style.display='inline-block'; btn.disabled = false; btn.textContent='Download';
      hint.textContent = m.id+' is not installed'+(size?' ('+size+')':'')+'. Download it, otherwise the first request has to fetch it from the internet.';
    }
  }
}
async function downloadSelected(kind){
  const selId = {image:'model', audio:'trmodel', upscale:'upmodel'}[kind];
  const btnId = {image:'dlImage', audio:'dlAudio', upscale:'dlUpscale'}[kind];
  const sel = document.getElementById(selId);
  const id = sel && sel.value;
  if (!id) return;
  const btn = document.getElementById(btnId);
  if (btn) { btn.disabled = true; btn.textContent = 'starting…'; }
  log('download '+id+' ('+kind+')');
  try {
    const r = await fetch('/v1/models/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    const j = await r.json();
    if (!r.ok) {
      log('download ERROR '+r.status+': '+JSON.stringify(j).slice(0,300));
      alert('Download failed: '+(j.error||r.status));
      return;
    }
    pollModels();
  } catch(e) {
    log('download error: '+e);
    if (btn) { btn.disabled = false; btn.textContent = 'Download'; }
  }
}
let modelTimer = null;
function pollModels(){
  refresh();
  clearTimeout(modelTimer);
  modelTimer = setTimeout(() => {
    if (MODELS.some(m => m.install_state === 'downloading')) pollModels();
  }, 2500);
}
async function refresh(){
  const st = document.getElementById('status');
  try {
    const h = await (await fetch('/health')).json();
    const m = await (await fetch('/v1/models')).json();
    MODELS = m.data || [];
    const imageModels = MODELS.filter(x => x.kind === 'image');
    const audioModels = MODELS.filter(x => x.kind === 'audio');
    const upModels = MODELS.filter(x => x.kind === 'upscale');
    // Image models: keep the saved/default choice.
    const sel = document.getElementById('model');
    const prev = sel.value;
    fillSelect(sel, imageModels, 'image');
    let chosen = prev;
    try { if (!chosen) chosen = localStorage.getItem('u_model'); } catch(e){}
    if (!chosen || !imageModels.some(x => x.id === chosen)) {
      chosen = m.default_image_model || (imageModels[0] && imageModels[0].id) || '';
    }
    if (chosen) sel.value = chosen;
    // Transcription models: installed first, prefer small for SK.
    const trsel = document.getElementById('trmodel');
    const prevTr = trsel.value;
    const audioSorted = audioModels.slice().sort((a,b) => (b.installed?1:0) - (a.installed?1:0));
    fillSelect(trsel, audioSorted, 'audio');
    let savedTr = '';
    try { savedTr = localStorage.getItem('u_trmodel') || ''; } catch(e){}
    if (audioModels.length) {
      if (prevTr && audioModels.some(x => x.id === prevTr)) trsel.value = prevTr;
      else if (savedTr && audioModels.some(x => x.id === savedTr)) trsel.value = savedTr;
      else {
        const pref = audioModels.find(x => x.id === 'small' && x.installed)
          || audioModels.find(x => x.installed)
          || audioModels.find(x => x.id === 'small')
          || audioModels[0];
        if (pref) trsel.value = pref.id;
      }
    }
    // Upscale models.
    const upsel = document.getElementById('upmodel');
    fillSelect(upsel, upModels, 'upscale');
    try {
      const savedUp = localStorage.getItem('u_upmodel');
      if (savedUp && upModels.some(x => x.id === savedUp)) upsel.value = savedUp;
    } catch(e){}
    syncDownloads();
    const miss = m.missing_models || [];
    const w = document.getElementById('warn');

async function pollProgress(id, btn, label){
  const t0 = Date.now();
  let errs = 0;
  while (Date.now()-t0 < 1000*60*10) {
    await new Promise(r=>setTimeout(r, 2000));
    let p = null;
    try { p = await (await fetch('/v1/images/progress/'+id)).json(); }
    catch(e){ if(++errs > 5) break; else continue; }
    if (p && p.status && p.status!=='unknown') {
      btn.textContent = label+'… '+ (p.percent||0) +'%';
      if (p.status==='done'||p.status==='error') break;
    }
  }
}

let paintImg = null;
const pad = document.getElementById('maskpad');
const pctx = pad.getContext('2d');
pctx.fillStyle = '#000'; pctx.fillRect(0,0,pad.width,pad.height);
let drawing = false;
function padPos(e){
  const r = pad.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  return [cx * pad.width / r.width, cy * pad.height / r.height];
}
function dot(x, y){
  pctx.fillStyle = '#fff'; pctx.strokeStyle = '#fff';
  const b = +document.getElementById('brush').value;
  pctx.lineWidth = b; pctx.lineCap = 'round';
  pctx.beginPath(); pctx.moveTo(x, y); pctx.lineTo(x+0.1, y+0.1); pctx.stroke();
}
pad.addEventListener('pointerdown', e => { drawing = true; pad.setPointerCapture(e.pointerId); const [x,y]=padPos(e); dot(x,y); });
pad.addEventListener('pointermove', e => { if(!drawing) return; const [x,y]=padPos(e); dot(x,y); });
pad.addEventListener('pointerup', () => drawing = false);
function clearMask(){ pctx.fillStyle='#000'; pctx.fillRect(0,0,pad.width,pad.height); }
function loadPaint(inp){
  const f = inp.files[0]; if(!f) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    c.getContext('2d').drawImage(img, 0, 0);
    paintImg = c.toDataURL('image/png').split(',')[1];
    clearMask(); log('inpaint source loaded '+img.width+'x'+img.height);
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
}

function fmtGb(x){ return (x||0).toFixed(2)+' GB'; }

function catalogRow(m){
  const row = document.createElement('div');
  row.style.cssText = 'padding:8px 0;border-bottom:1px solid var(--border)';

  const line = document.createElement('div');
  line.style.cssText = 'display:flex;gap:8px;align-items:center';

  const info = document.createElement('div');
  info.style.cssText = 'flex:1';
  const state = m.installed ? 'INSTALLED'
    : (m.install_state==='downloading' ? 'DOWNLOADING '+(m.install_progress||0)+'%'
    : (m.install_state==='error' || m.install_state==='failed' ? 'ERROR' : 'not installed'));
  const color = m.installed ? '#7ee787'
    : ((m.install_state==='error'||m.install_state==='failed') ? '#ff7b72' : '#d29922');
  const engine = m.engine ? ' · '+m.engine : '';
  info.innerHTML = '<b style="font-size:13px">'+(m.label||m.id)+'</b>'
    + '<div style="font-size:11px;color:#7d8590">'+m.id+engine+' · '
    + (m.size_mb ? m.size_mb+' MB' : fmtGb(m.size_gb))
    + ' · <span style="color:'+color+'">'+state+'</span></div>'
    + (m.install_error ? '<div style="font-size:11px;color:#ff7b72">'+m.install_error+'</div>' : '');

  const btn = document.createElement('button');
  btn.className = 'go';
  btn.style.cssText = 'margin:0;width:130px;padding:6px;font-size:12px;'
    + (m.installed ? 'background:#da3633' : 'background:#238636');
  const noSource = m.has_source === false;
  const downloading = m.install_state === 'downloading';
  btn.textContent = downloading ? 'Stop'
    : (m.installed ? 'Uninstall' : (noSource ? 'No source' : 'Install'));
  btn.disabled = !downloading && (!m.installed && noSource);
  btn.onclick = () => downloading ? cancelModel(m.id)
    : (m.installed ? uninstallModel(m.id) : installModel(m.id));

  line.appendChild(info);
  line.appendChild(btn);
  row.appendChild(line);

  if (m.install_state === 'downloading') {
    const bar = document.createElement('div');
    bar.style.cssText = 'height:4px;background:var(--panel2);border-radius:2px;margin-top:6px';
    const fill = document.createElement('div');
    fill.style.cssText = 'height:4px;width:'+(m.install_progress||2)+'%;background:#2f81f7;border-radius:2px';
    bar.appendChild(fill);
    row.appendChild(bar);
  }
  return row;
}

function renderCatalog(){
  const box = document.getElementById('modelList');
  box.innerHTML = '';
  const labels = {};
  for (const k of KINDS) labels[k.id] = k.label;
  const groups = {};
  for (const m of CATALOG) {
    const k = m.kind || 'other';
    (groups[k] = groups[k] || []).push(m);
  }
  const order = KINDS.map(k => k.id).filter(k => groups[k]);
  for (const k of Object.keys(groups)) if (!order.includes(k)) order.push(k);

  for (const kind of order) {
    const items = groups[kind];
    const det = document.createElement('details');
    det.open = true;
    det.style.cssText = 'margin:6px 0';
    const sum = document.createElement('summary');
    sum.style.cssText = 'cursor:pointer;font-size:12px;font-weight:600;color:var(--text);padding:8px 4px';
    sum.textContent = (labels[kind] || kind) + '  (' + items.length + ')';
    det.appendChild(sum);
    for (const m of items) det.appendChild(catalogRow(m));
    box.appendChild(det);
  }
}

function pollAdd(name){

  fetch('/v1/models/add/status/'+encodeURIComponent(name)).then(r=>r.json()).then(j=>{
    if(j.state === 'downloading'){ addTimer = setTimeout(()=>pollAdd(name), 3000); }
    else {
      log('add '+name+': '+j.state+(j.error?' ('+j.error+')':''));
      loadCustom();
      refresh();
    }
  }).catch(()=>{ addTimer = setTimeout(()=>pollAdd(name), 5000); });
}

async function loadCustom(){
  try {
    const r = await fetch('/v1/models/custom');
    const j = await r.json();
    const box = document.getElementById('customList');
    box.innerHTML = '';
    if(!(j.models||[]).length){ box.innerHTML = '<div style="font-size:12px;color:#7d8590;padding:6px">none</div>'; return; }
    for (const m of j.models) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)';
      const info = document.createElement('div');
      info.style.cssText = 'flex:1;font-size:12px';
      const state = m.state === 'downloading' ? 'DOWNLOADING '+m.progress+'%' : (m.state === 'error' ? 'ERROR' : '');
      info.innerHTML = '<b>'+m.name+'</b><div style="color:#7d8590;font-size:11px">'
        + fmtGb(m.size_gb)+(state?' · <span style="color:#d29922">'+state+'</span>':'')+'</div>';
      const btn = document.createElement('button');
      btn.className = 'go';
      btn.style.cssText = 'margin:0;width:96px;padding:5px;font-size:11px;background:#da3633';
      btn.textContent = 'Delete';
      btn.disabled = m.state === 'downloading';
      btn.onclick = () => deleteCustom(m.name);
      row.appendChild(info); row.appendChild(btn);
      box.appendChild(row);
    }
  } catch(e){ log('custom list error: '+e); }
}

async function deleteCustom(name){
  if(!confirm('Delete model directory "'+name+'" from models/?')) return;
  try {
    const r = await fetch('/v1/models/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
    const j = await r.json();
    if(!r.ok){ log('delete ERROR '+r.status+': '+JSON.stringify(j)); alert(JSON.stringify(j)); return; }
    log('deleted custom model '+name);
    loadCustom();
  } catch(e){ log('delete error: '+e); }
}

async function installModel(id){
  log('install '+id+'…');
  try {
    const r = await fetch('/v1/models/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    const j = await r.json();
    if(!r.ok){ log('ERROR '+r.status+': '+JSON.stringify(j)); alert(JSON.stringify(j)); return; }
    pollCatalog();
  } catch(e){ log('install error: '+e); }
}
async function uninstallModel(id){
  if(!confirm('Uninstall '+id+'? Files will be deleted.')) return;
  log('uninstall '+id+'…');
  try {
    const r = await fetch('/v1/models/uninstall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    const j = await r.json();
    if(!r.ok){ log('ERROR '+r.status+': '+JSON.stringify(j)); alert(JSON.stringify(j)); return; }
    log('removed '+id);
    loadCatalog();
  } catch(e){ log('uninstall error: '+e); }
}
async function installMissing(){
  const missing = CATALOG.filter(m => !m.installed && m.install_state !== 'downloading' && m.has_source !== false);
  if (!missing.length) { alert('Every catalog model is already installed.'); return; }
  const total = missing.reduce((s,m) => s + (m.size_gb||0), 0);
  const names = missing.map(m => '• '+m.id+' ('+(m.size_mb ? m.size_mb+' MB' : fmtGb(m.size_gb))+')').join('\n');
  if (!confirm('Download '+missing.length+' model(s), about '+total.toFixed(1)+' GB?\n\n'+names)) return;
  for (const m of missing) await installModel(m.id);
}
let catalogTimer = null;
function pollCatalog(){
  loadCatalog();
  refresh();
  clearTimeout(catalogTimer);
  catalogTimer = setTimeout(() => {
    if (CATALOG.some(m => m.install_state === 'downloading')) pollCatalog();
  }, 3000);
}

// ---------- settings ----------
async function loadSettings(){
  try {
    const r = await fetch('/v1/settings');
    const j = await r.json();
    const e = j.engines || {};
    document.getElementById('settingsBox').textContent =
      'version: '+j.version+'\n'
      + 'port: '+j.port+'\n'
      + 'whisper: '+(j.whisper_mode||'?')+(j.whisper_url?' · remote url '+j.whisper_url:'')+'\n'
      + 'models dir: '+j.models_dir+'\n'
      + 'output dir: '+(j.output_dir||'-')+'\n'
      + 'default image model: '+j.default_image_model+'\n'
      + 'audio models: '+(j.audio_models||[]).join(', ')+'\n\n'
      + 'engines:\n'
      + '  torch: '+(e.torch?'yes':'no')+'  cuda: '+(e.cuda?'yes':'no')+'\n'
      + '  onnxruntime: '+(e.onnxruntime?'yes':'no')+'\n'
      + '  whisper native: '+(e.whisper_native?'yes':'no')+'\n'
      + '  ffmpeg: '+(e.ffmpeg||'not found')+'\n'
      + '  ffprobe: '+(e.ffprobe||'not found')+'\n'
      + '  yt-dlp: '+(e.ytdlp||'not installed (pip install yt-dlp)');
  } catch(e){
    document.getElementById('settingsBox').textContent = 'settings error: '+e;
  }
}

refresh();
try {
  for (const id of ['model','prompt','prompt2','prompt3','size','size2','quality','quality2']) {
    const el = document.getElementById(id);
    const saved = localStorage.getItem('u_'+id);
    if (saved !== null && el) el.value = saved;
    if (el) el.addEventListener('change', () => { localStorage.setItem('u_'+id, el.value); if(id==='model') refresh(); });
  }
} catch(e){}
