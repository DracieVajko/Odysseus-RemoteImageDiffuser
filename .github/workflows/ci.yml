name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  pc:
    name: PC tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # Torch/transformers/onnxruntime are imported lazily by the server, so
        # the unit/contract suite runs without the 2 GB ML stack.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pydantic numpy pillow pytest \
                      python-multipart starlette pyyaml requests
      - name: pytest
        working-directory: pc
        run: python -m pytest -q

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" | tail -2
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prism-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
